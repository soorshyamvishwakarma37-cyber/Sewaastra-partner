 <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SewaAstra | Secure Google Login</title>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --p: #e0394c;
            --s: #0f172a;
            --bg: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: var(--bg);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Login Container */
        .login-box {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.05);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-area {
            background: var(--p);
            width: 70px;
            height: 70px;
            border-radius: 22px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 30px;
            box-shadow: 0 10px 20px rgba(224, 57, 76, 0.3);
        }

        h2 { font-family: 'Montserrat'; font-size: 24px; color: var(--s); margin-bottom: 8px; }
        p { color: #64748b; font-size: 13px; margin-bottom: 35px; line-height: 1.5; }

        /* Google Button Wrapper */
        #google-btn-container {
            display: flex;
            justify-content: center;
            min-height: 50px;
        }

        /* Success/Profile View */
        #profile-view {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .user-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid var(--p);
            margin-bottom: 15px;
        }

        .btn-exit {
            margin-top: 25px;
            padding: 12px 25px;
            background: var(--s);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .loader {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--p);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="login-box">
        <div id="login-view">
            <div class="logo-area"><i class="fa-solid fa-bolt-lightning"></i></div>
            <h2>SewaAstra Login</h2>
            <p>सुरक्षित लॉगिन के लिए अपने गूगल <br>अकाउंट का चयन करें</p>

            <div id="loader" class="loader"></div>
            
            <div id="google-btn-container">
                <div id="g_id_onload"
                    data-client_id="211091351218-s08jo336t0dieb050q02r4bqvdod891m.apps.googleusercontent.com"
                    data-context="signin"
                    data-ux_mode="popup"
                    data-callback="onGoogleSuccess"
                    data-auto_prompt="false">
                </div>

                <div class="g_id_signin"
                    data-type="standard"
                    data-shape="pill"
                    data-theme="filled_blue"
                    data-text="signin_with"
                    data-size="large"
                    data-logo_alignment="left">
                </div>
            </div>
        </div>

        <div id="profile-view">
            <img id="u-img" src="" class="user-img">
            <h3 id="u-name">नमस्ते!</h3>
            <p id="u-email" style="margin-bottom:10px;"></p>
            <div style="color:var(--success); font-weight:700; font-size:14px;">
                <i class="fa-solid fa-circle-check"></i> सफलतापूर्वक वेरिफाइड
            </div>
            <button class="btn-exit" onclick="location.reload()">लॉग आउट करें</button>
        </div>
    </div>

    <script>
        // असली Google Response हैंडलर
        function onGoogleSuccess(response) {
            // लोडर दिखाएं
            document.getElementById('google-btn-container').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            // JWT टोकन डिकोड करें (यह असली डेटा निकालता है)
            const responsePayload = decodeJwtResponse(response.credential);

            console.log("ID: " + responsePayload.sub);
            console.log('Full Name: ' + responsePayload.name);
            console.log('Email: ' + responsePayload.email);
            console.log('Image: ' + responsePayload.picture);

            // UI अपडेट करें
            setTimeout(() => {
                document.getElementById('login-view').style.display = 'none';
                document.getElementById('profile-view').style.display = 'flex';
                
                document.getElementById('u-name').innerText = responsePayload.name;
                document.getElementById('u-email').innerText = responsePayload.email;
                document.getElementById('u-img').src = responsePayload.picture;

                speak(`स्वागत है ${responsePayload.name}, आपका लॉगिन सफल रहा।`);
            }, 1500);
        }

        // JWT टोकन डिकोडर फंक्शन
        function decodeJwtResponse(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));

            return JSON.parse(jsonPayload);
        }

        function speak(text) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'hi-IN';
            window.speechSynthesis.speak(msg);
        }

        window.onload = function () {
            console.log("SewaAstra Auth System Ready.");
        }
    </script>
</body>
</html>
