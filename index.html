 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SewaAstra Pro | Verification & Consent</title>
    <style>
        :root {
            --primary: #2563eb; --success: #10b981; --dark: #0f172a; 
            --bg: #f8fafc; --danger: #ef4444; --gray: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); padding: 20px; color: var(--dark); }

        .gate-card {
            background: white; border-radius: 24px; padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center;
        }

        /* UPLOAD SLOTS */
        .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        .upload-btn {
            border: 2px dashed #e2e8f0; border-radius: 12px; padding: 15px;
            font-size: 11px; color: var(--gray); cursor: pointer; position: relative;
        }
        .upload-btn.active { border-color: var(--success); background: #f0fdf4; color: var(--success); }
        .upload-btn input { position: absolute; opacity: 0; width: 100%; height: 100%; top: 0; left: 0; }

        /* SIGNATURE BOX */
        #sig-canvas {
            border: 1px solid #e2e8f0; border-radius: 12px; background: #fff;
            width: 100%; height: 120px; touch-action: none; margin: 10px 0;
        }

        /* CHECKBOX */
        .consent-row {
            display: flex; align-items: flex-start; gap: 10px;
            text-align: left; font-size: 12px; margin: 15px 0; line-height: 1.5;
        }
        input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); }

        /* FINAL BUTTON (DISABLED BY DEFAULT) */
        #whatsapp-btn {
            background: #cbd5e1; color: white; padding: 18px; border-radius: 12px;
            text-decoration: none; display: flex; align-items: center; justify-content: center;
            gap: 10px; font-weight: bold; pointer-events: none; transition: 0.3s;
        }
        #whatsapp-btn.enabled { background: #25D366; pointer-events: auto; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); }

        .id-badge { background: var(--dark); color: white; padding: 5px 12px; border-radius: 6px; font-family: monospace; display: inline-block; margin: 10px 0; }
    </style>
</head>
<body>

    <div class="gate-card">
        <h2 style="font-weight: 800;">Verify Identity</h2>
        <p style="font-size: 13px; color: var(--gray); margin-top: 5px;">Step 1: Provide Documents & Signature</p>

        <div class="id-badge" id="p-id">SA-PRO-9901</div>

        <div class="upload-grid">
            <div class="upload-btn" id="slot1">
                📸 Aadhaar Front
                <input type="file" onchange="validateUpload('slot1')">
            </div>
            <div class="upload-btn" id="slot2">
                📸 Aadhaar Back
                <input type="file" onchange="validateUpload('slot2')">
            </div>
            <div class="upload-btn" id="slot3">
                📄 PAN Card
                <input type="file" onchange="validateUpload('slot3')">
            </div>
            <div class="upload-btn" id="slot4">
                🛂 Police Cert.
                <input type="file" onchange="validateUpload('slot4')">
            </div>
        </div>

        <p style="text-align: left; font-size: 12px; font-weight: bold;">Digital Signature:</p>
        <canvas id="sig-canvas"></canvas>
        <button onclick="clearSig()" style="background:none; border:none; color:var(--danger); font-size:11px; cursor:pointer;">Clear Signature ↺</button>

        <div class="consent-row">
            <input type="checkbox" id="consent-check" onchange="checkCompletion()">
            <label for="consent-check">
                I hereby declare that all uploaded documents are original and I agree to the SewaAstra Partner Terms of Service.
            </label>
        </div>

        <a href="#" id="whatsapp-btn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="20">
            Request Admin Approval
        </a>
        <p id="error-msg" style="font-size: 10px; color: var(--danger); margin-top: 10px;">Please complete all fields to enable button.</p>
    </div>

    <script>
        const canvas = document.getElementById('sig-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let uploadsDone = { slot1: false, slot2: false, slot3: false, slot4: false };

        // Handle File Upload State
        function validateUpload(id) {
            document.getElementById(id).classList.add('active');
            document.getElementById(id).innerText = "✅ Attached";
            uploadsDone[id] = true;
            checkCompletion();
        }

        // Signature Logic
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            return { x: (e.clientX || e.touches[0].clientX) - rect.left, y: (e.clientY || e.touches[0].clientY) - rect.top };
        }
        canvas.addEventListener('mousedown', () => isDrawing = true);
        canvas.addEventListener('touchstart', (e) => { isDrawing = true; e.preventDefault(); });
        window.addEventListener('mouseup', () => { if(isDrawing) checkCompletion(); isDrawing = false; });
        window.addEventListener('touchend', () => { if(isDrawing) checkCompletion(); isDrawing = false; });
        
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchmove', (e) => { draw(e); e.preventDefault(); });

        function draw(e) {
            if (!isDrawing) return;
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#0f172a';
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function clearSig() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            checkCompletion();
        }

        // COMPLETION LOGIC
        function checkCompletion() {
            const allFiles = Object.values(uploadsDone).every(v => v === true);
            const isChecked = document.getElementById('consent-check').checked;
            const btn = document.getElementById('whatsapp-btn');
            const error = document.getElementById('error-msg');
            const partnerID = document.getElementById('p-id').innerText;

            if (allFiles && isChecked) {
                btn.classList.add('enabled');
                error.style.display = 'none';
                
                // Set WhatsApp Link
                const msg = encodeURIComponent(`Hi Admin, I have uploaded my 4 documents and signed the agreement.\nPartner ID: ${partnerID}\nPlease approve my account.`);
                btn.href = `https://wa.me/917869969190?text=${msg}`;
            } else {
                btn.classList.remove('enabled');
                error.style.display = 'block';
            }
        }
    </script>
</body>
</html>
