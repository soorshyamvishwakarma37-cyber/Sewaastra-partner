<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SewaAstra Official Partner App</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>

    <style>
        :root { --p: #00c853; --s: #121212; --bg: #f8fafc; --border: #e2e8f0; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); overflow: hidden; height: 100vh; color: #1e293b; }

        /* Navigation Logic */
        .screen { position: absolute; inset: 0; display: none; flex-direction: column; background: var(--bg); z-index: 10; }
        .screen.active { display: flex; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* UI Components */
        header { background: var(--white); padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); z-index: 100; }
        .btn-p { background: var(--p); color: white; border: none; padding: 18px; border-radius: 16px; width: 100%; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 8px 20px rgba(0,200,83,0.2); }
        .card { background: var(--white); margin: 15px; padding: 20px; border-radius: 20px; border: 1px solid var(--border); }

        /* Map */
        #main-map { flex: 1; width: 100%; z-index: 1; }

        /* KYC Styles */
        .up-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .up-card { border: 2px dashed var(--border); padding: 12px; border-radius: 12px; text-align: center; position: relative; }
        .up-card i { color: var(--p); font-size: 20px; }
        .up-card input { position: absolute; inset: 0; opacity: 0; }
        canvas { border: 1px solid #ddd; background: #fafafa; border-radius: 10px; width: 100%; height: 120px; }

        /* Bottom Nav */
        nav { position: fixed; bottom: 0; width: 100%; background: var(--white); height: 75px; display: none; border-top: 1px solid var(--border); z-index: 1000; padding-bottom: 10px; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; font-size: 11px; }
        .nav-item.active { color: var(--p); font-weight: 800; }
    </style>
</head>
<body>

    <div id="scr-auth" class="screen active" style="justify-content: center; padding: 30px; background: white;">
        <div style="text-align: center; margin-bottom: 40px;">
            <h1 style="font-size: 38px;">Sewa<span style="color:var(--p)">Astra</span></h1>
            <p style="color:#64748b;">Partner Enterprise Portal</p>
        </div>
        <input type="tel" id="uPhone" placeholder="मोबाइल नंबर" style="width:100%; padding:18px; border-radius:15px; border:1px solid #ddd; margin-bottom:15px; font-size:16px;">
        <input type="password" id="uPass" placeholder="पासवर्ड" style="width:100%; padding:18px; border-radius:15px; border:1px solid #ddd; margin-bottom:20px; font-size:16px;">
        <button class="btn-p" onclick="app.handleAuth()">प्रवेश करें <i class="fa fa-arrow-right"></i></button>
    </div>

    <div id="scr-lock" class="screen" style="justify-content: center; text-align: center; padding: 40px;">
        <div style="font-size: 70px; margin-bottom: 20px;">⏳</div>
        <h2>Verification Pending</h2>
        <p style="color:#64748b; margin: 15px 0;">आपकी ID अभी रिव्यू में है। एडमिन द्वारा अप्रूव होने पर आपको सूचित किया जाएगा।</p>
        <button class="btn-p" style="background:#25D366" onclick="app.contactWA()">WhatsApp Admin</button>
        <button onclick="location.reload()" style="margin-top:20px; border:none; background:none; color:var(--p); font-weight:700;">Refresh Status</button>
    </div>

    <div id="scr-dash" class="screen">
        <header>
            <b>SewaAstra Live</b>
            <div style="color:var(--p); font-weight:800; font-size:12px;">● ONLINE</div>
        </header>
        <div id="main-map"></div>
    </div>

    <div id="scr-set" class="screen" style="overflow-y: auto;">
        <header><b>Profile & KYC</b></header>
        
        <div class="card">
            <h3 style="margin-bottom:15px;">KYC Documents</h3>
            <div class="up-grid">
                <div class="up-card"><i class="fa fa-id-card"></i><br><small>Aadhar F</small><input type="file" onchange="app.upOk(this)"></div>
                <div class="up-card"><i class="fa fa-id-card"></i><br><small>Aadhar B</small><input type="file" onchange="app.upOk(this)"></div>
                <div class="up-card"><i class="fa fa-file-invoice"></i><br><small>PAN Card</small><input type="file" onchange="app.upOk(this)"></div>
                <div class="up-card"><i class="fa fa-user-shield"></i><br><small>Police Ver</small><input type="file" onchange="app.upOk(this)"></div>
            </div>

            <div style="margin-top:20px;">
                <p style="font-size:12px; font-weight:800; margin-bottom:5px;">डिजिटल सिग्नेचर:</p>
                <canvas id="sig-pad"></canvas>
                <button onclick="app.clearSig()" style="font-size:10px; color:red; border:none; background:none;">Clear</button>
            </div>

            <div style="display:flex; gap:10px; margin-top:20px; background:#f1f5f9; padding:10px; border-radius:10px;">
                <input type="checkbox" id="agree">
                <label for="agree" style="font-size:11px;">मैं SewaAstra के सभी नियमों और एग्रीमेंट को स्वीकार करता हूँ।</label>
            </div>

            <button class="btn-p" style="margin-top:20px;" onclick="app.submitKYC()">Update & Notify Admin</button>
        </div>

        <button onclick="app.logout()" style="margin:0 15px 30px; color:red; border:none; background:none; font-weight:700;">Logout Account</button>
    </div>

    <nav id="bot-nav">
        <div class="nav-item active" id="n-dash" onclick="app.nav('scr-dash', 'n-dash')"><i class="fa fa-compass"></i><span>Jobs</span></div>
        <div class="nav-item" id="n-set" onclick="app.nav('scr-set', 'n-set')"><i class="fa fa-user-circle"></i><span>Account</span></div>
    </nav>

    <script>
        // Firebase Configuration
        const firebaseConfig = { databaseURL: "https://sewaastra-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // App Object Logic
        const app = {
            user: null,
            map: null,
            sig: null,

            init() {
                const saved = localStorage.getItem('sa_user');
                if(saved) {
                    this.user = saved;
                    this.checkStatus();
                }
                // Init Signature Pad
                const canvas = document.getElementById('sig-pad');
                this.sig = new SignaturePad(canvas);
            },

            handleAuth() {
                const phone = document.getElementById('uPhone').value;
                const pass = document.getElementById('uPass').value;
                if(phone.length < 10) return alert("Valid number डालें");

                db.ref('partners/' + phone).once('value').then(s => {
                    const p = s.val();
                    if(!p) {
                        db.ref('partners/' + phone).set({ phone, pass, isApproved: false });
                        this.user = phone;
                        localStorage.setItem('sa_user', phone);
                        this.show('scr-lock');
                    } else if(p.pass === pass) {
                        this.user = phone;
                        localStorage.setItem('sa_user', phone);
                        this.checkStatus();
                    } else { alert("Wrong Password"); }
                });
            },

            checkStatus() {
                db.ref('partners/' + this.user).on('value', s => {
                    const p = s.val();
                    if(p.isApproved) {
                        this.show('scr-dash');
                        document.getElementById('bot-nav').style.display = 'flex';
                        this.initMap();
                    } else {
                        this.show('scr-lock');
                    }
                });
            },

            initMap() {
                if(!this.map) {
                    this.map = L.map('main-map', { zoomControl: false }).setView([23.2333, 77.4333], 14);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(this.map);
                    L.marker([23.2333, 77.4333]).addTo(this.map);
                }
                setTimeout(() => this.map.invalidateSize(), 300);
            },

            show(id) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(id).classList.add('active');
            },

            nav(scr, navId) {
                this.show(scr);
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                document.getElementById(navId).classList.add('active');
                if(scr === 'scr-dash') this.initMap();
            },

            upOk(el) { el.parentElement.style.borderColor = "#00c853"; },
            clearSig() { this.sig.clear(); },

            submitKYC() {
                if(!document.getElementById('agree').checked) return alert("Agreement स्वीकार करें");
                if(this.sig.isEmpty()) return alert("साइन करना अनिवार्य है");

                const msg = `SewaAstra KYC ALERT:\nPartner: ${this.user}\nDocuments: Uploaded\nAgreement: Signed ✅\nAction: Please Approve.`;
                window.location.href = `https://wa.me/917869969190?text=${encodeURIComponent(msg)}`;
            },

            contactWA() {
                window.open(`https://wa.me/917869969190?text=Hi, Approve my ID: ${this.user}`);
            },

            logout() { localStorage.clear(); location.reload(); }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
